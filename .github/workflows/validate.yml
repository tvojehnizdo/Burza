name: validate-pulse-hunter

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py engine.py microstructure.py alpha_discovery.py history_fetch.py historical_research.py smoke_live.py research.py v4_smoke.py kraken_private.py
      - run: python -c "import engine, json; r=engine.selftest_report(); print(json.dumps(r,indent=2)); assert r['ok']"
      - run: python v4_smoke.py | tee v4-smoke.json
      - run: python -c "import kraken_private, json; r=kraken_private.signature_selftest(); print(json.dumps(r,indent=2)); assert r['ok']"
      - shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw ./spustit_vse.ps1))
          Write-Host "PowerShell syntax OK"
      - shell: pwsh
        run: |
          @'
          # KRAKEN
          $env:KRAKEN_API_KEY = "dummy-key"
          KRAKEN_API_SECRET: "dummy-secret-xxxxxxxxxxxxxxxx"
          '@ | Set-Content ./parser-test.env
          python -c "import kraken_private; from pathlib import Path; v,e,c=kraken_private.parse_env_tolerant(Path('parser-test.env')); assert v['KRAKEN_API_KEY']=='dummy-key'; assert v['KRAKEN_API_SECRET'].startswith('dummy-secret'); print('Vault parser OK')"
      - run: python smoke_live.py | tee smoke-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            v4-smoke.json
            smoke-report.json
