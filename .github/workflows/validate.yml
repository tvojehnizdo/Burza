name: validate-pulse-hunter

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py engine.py microstructure.py alpha_discovery.py relative_value.py fx_breakout.py rv_live.py kraken_inventory.py dynamic_universe.py fast_canary.py consolidate_usdc.py history_fetch.py historical_research.py smoke_live.py research.py v4_smoke.py kraken_private.py kraken_live_control.py futures_private.py futures_canary.py ai_supervisor.py live_bridge.py
      - run: python -c "import engine, json; r=engine.selftest_report(); print(json.dumps(r,indent=2)); assert r['ok']"
      - run: python v4_smoke.py | tee v4-smoke.json
      - run: python -c "import kraken_private, json; r=kraken_private.signature_selftest(); print(json.dumps(r,indent=2)); assert r['ok']"
      - run: python -c "import relative_value, json; r=relative_value.selftest(); print(json.dumps(r,indent=2)); assert r['ok']"
      - run: python -c "import fx_breakout, json; r=fx_breakout.selftest(); print(json.dumps(r,indent=2)); assert r['ok']"
      - run: python -c "import rv_live, json; r=rv_live.selftest(); print(json.dumps(r,indent=2)); assert r['ok']"
      - shell: pwsh
        run: |
          foreach ($f in @("./spustit_vse.ps1","./start_v4_neutral.ps1","./start_v4_aggressive.ps1","./prepare_futures.ps1","./spustit_supervisor.ps1","./spustit_komplet.ps1","./arm_live.ps1","./disarm_live.ps1","./arm_rv_live.ps1","./disarm_rv_live.ps1","./spustit_rv_live.ps1","./spustit_futures_canary.ps1","./stav_impulse.ps1")) {
            $null = [scriptblock]::Create((Get-Content -Raw $f))
            Write-Host "$f syntax OK"
          }
      - shell: pwsh
        run: |
          $text = Get-Content -Raw ./spustit_supervisor.ps1
          if ($text -notmatch 'Get-FreeTcpPort') { throw "Dynamic port selection missing" }
          if ($text -notmatch '8771') { throw "Supervisor port range missing" }
          Write-Host "Dynamic supervisor port selection present"
      - shell: pwsh
        run: |
          $k = ConvertTo-SecureString "dummy-key-123456789" -AsPlainText -Force
          $s = ConvertTo-SecureString "dummy-secret-12345678901234567890" -AsPlainText -Force
          $obj = [ordered]@{ api_key = ConvertFrom-SecureString $k; api_secret = ConvertFrom-SecureString $s }
          $pair = @(
            (ConvertTo-SecureString -String ([string]$obj.api_key)),
            (ConvertTo-SecureString -String ([string]$obj.api_secret))
          )
          if ($pair.Count -ne 2) { throw "DPAPI pair load failed" }
          Write-Host "DPAPI pair load pattern OK"
      - shell: pwsh
        run: |
          @'
          # KRAKEN
          $env:KRAKEN_API_KEY = "dummy-key"
          KRAKEN_API_SECRET: "dummy-secret-xxxxxxxxxxxxxxxx"
          '@ | Set-Content ./parser-test.env
          python -c "import kraken_private; from pathlib import Path; v,e,c=kraken_private.parse_env_tolerant(Path('parser-test.env')); assert v['KRAKEN_API_KEY']=='dummy-key'; assert v['KRAKEN_API_SECRET'].startswith('dummy-secret'); print('Vault parser OK')"
      - run: python smoke_live.py | tee smoke-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            v4-smoke.json
            smoke-report.json
